
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Engineering Calculator RK</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f4f8;
    padding: 25px;
}

.container {
    max-width: 520px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}

h1 {
    color: #245b45;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin-top: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    background: #245b45;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.result {
    margin-top: 20px;
    padding: 18px;
    background: #e8f3ed;
    border-radius: 8px;
    line-height: 1.9;
}

.total {
    color: #176b3a;
    font-size: 24px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Engineering Calculator RK</h1>

<p>Расчёт объёма бетона фундаментной плиты</p>

<label>Длина плиты, м</label>
<input type="number" id="length" value="44.37" step="any">

<label>Ширина плиты, м</label>
<input type="number" id="width" value="20.04" step="any">

<label>Толщина плиты, м</label>
<input type="number" id="height" value="0.8" step="any">

<label>Запас бетона, %</label>
<input type="number" id="reserve" value="5" min="0" max="100" step="any">

<button onclick="calculate()">Рассчитать</button>

<div class="result" id="result">
Введите исходные данные и нажмите «Рассчитать».
</div>

</div>

<script>

function calculate() {

    const L = document.getElementById("length").value;
    const B = document.getElementById("width").value;
    const H = document.getElementById("height").value;
    const P = document.getElementById("reserve").value;

    const length = Number(L);
    const width = Number(B);
    const height = Number(H);
    const reserve = Number(P);

    const result = document.getElementById("result");

    if (!L || !B || !H || P === "" ||
        !Number.isFinite(length) ||
        !Number.isFinite(width) ||
        !Number.isFinite(height) ||
        !Number.isFinite(reserve) ||
        length <= 0 || width <= 0 ||
        height <= 0 || reserve < 0 ||
        reserve > 100) {

        result.innerText =
        "Ошибка! Проверьте исходные данные.";

        return;
    }

    const area = length * width;

    const volume = area * height;

    const additional = volume * reserve / 100;

    const total = volume + additional;

    result.innerHTML =
    "Площадь плиты: " + area.toFixed(2) + " м²<br>" +
    "Объём бетона: " + volume.toFixed(2) + " м³<br>" +
    "Дополнительный объём: " + additional.toFixed(2) + " м³<br>" +
    "Общий объём с запасом:<br>" +
    "<span class='total'>" + total.toFixed(2) + " м³</span>";

}

</script>

</body>
</html>
